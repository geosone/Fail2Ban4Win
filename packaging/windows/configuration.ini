; Start in diagnostic mode. Configure trusted event sources before activation.
isDryRun=true
maxAllowedFailures=9
failureWindow=00:10:00
banPeriod=01:00:00
; 0 means one address, not an entire /24 subnet.
banSubnetBits=0
banRepeatedOffenseCoefficient=0
banRepeatedOffenseMax=1
neverBanReservedSubnets=true
unbanAllOnStartup=false

[neverBanSubnets]
0=127.0.0.1/32
1=::1/128

; No event selectors by default. Mystic file ingestion is a separate adapter.
; Example after enabling the relevant Windows event channel:
; [eventLogSelectors:0]
; friendlyName=Remote Desktop Services
; logName=Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational
; eventId=140
; ipAddressEventDataName=IPString

[mysticHook]
enabled=false
pipeName=Fail2Ban4Win.Mystic
allowedClientSid=
mysticRoot=
denyListPath=
synchronizeDenyList=true
unbanInMystic=true
